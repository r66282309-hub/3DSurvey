<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Viewer 3D</title><link rel="stylesheet" href="assets/style.css" /><script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script></head>
