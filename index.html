<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebGIS punti 3D</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
</head>
<body>
<header class="topbar"><h1>WebGIS punti 3D</h1><nav><a class="secondary" href="#" onclick="loadPoints();return false;">Aggiorna</a> <a href="survey.html">Inserisci punto</a></nav></header>
<main id="map"></main>
<div id="photo-modal" class="photo-modal" onclick="closePhotoModal()"><div class="photo-modal-content" onclick="event.stopPropagation()"><div class="photo-modal-bar"><span id="photo-title">Foto</span><button onclick="closePhotoModal()">Chiudi</button></div><img id="photo-img" src="" alt="Foto punto"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const cfg=window.APP_CONFIG;const supabaseClient=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
const map=L.map("map").setView([40.72,8.56],13);
const esriImagery=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{attribution:"Tiles &copy; Esri"}).addTo(map);
const esriTopo=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",{attribution:"Tiles &copy; Esri"});
let pointsLayer=L.layerGroup().addTo(map);
let accessLayer=L.layerGroup();

const baseLayers={
  "Esri Satellite":esriImagery,
  "Esri Topografica":esriTopo
};

const overlayLayers={
  "Punti 3D / survey":pointsLayer,
  "Punti sopralluogo accessibilità":accessLayer
};

L.control.layers(baseLayers,overlayLayers,{collapsed:false}).addTo(map);
function esc(v){if(v===null||v===undefined)return "";return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function js(v){return String(v||"").replaceAll("\\","\\\\").replaceAll("'","\\'").replaceAll('"','\\"').replaceAll("\n"," ")}
function norm(p){if(!p)return "";p=String(p).trim();return p.startsWith("http")?p:(cfg.MODEL_BASE_PATH||"")+p}
function openPhotoModal(url,title){document.getElementById("photo-img").src=url;document.getElementById("photo-title").textContent=title||"Foto";document.getElementById("photo-modal").classList.add("open")}
function closePhotoModal(){document.getElementById("photo-modal").classList.remove("open");document.getElementById("photo-img").src=""}
function popupHtml(p){
 const nome=esc(p.nome||"Punto senza nome"), desc=esc(p.descrizione||""), note=esc(p.note||""), data=esc(p.data_rilievo||"");
 const modello=norm(p.modello_glb||""), f1=p.foto1_url||p.foto_url||"", f2=p.foto2_url||"";
 const viewer=modello?`viewer.html?model=${encodeURIComponent(modello)}&title=${encodeURIComponent(p.nome||"Modello 3D")}`:"";
 return `<div class="popup-title">${nome}</div>${desc?`<div class="popup-desc">${desc}</div>`:""}${data?`<div class="popup-meta">Data: ${data}</div>`:""}${note?`<div class="popup-meta">${note}</div>`:""}<div class="popup-meta">Lat: ${Number(p.lat).toFixed(6)} | Lon: ${Number(p.lon).toFixed(6)}</div><div class="popup-actions">${viewer?`<a href="${viewer}" target="_blank">Visualizza punto AR</a>`:""}${f1?`<button class="secondary" onclick="openPhotoModal('${js(f1)}','Foto 1 - ${js(p.nome)}')">Foto 1</button>`:""}${f2?`<button class="secondary" onclick="openPhotoModal('${js(f2)}','Foto 2 - ${js(p.nome)}')">Foto 2</button>`:""}${modello?`<a class="secondary" href="${esc(modello)}" target="_blank">GLB</a>`:""}</div>`;
}
function addPoint(p){
 if(p.lat===null||p.lon===null)return;
 const marker=L.circleMarker([p.lat,p.lon],{
  radius:8,
  color:"#111827",
  weight:1.5,
  fillColor:"#ff8c00",
  fillOpacity:.9
 });
 marker.bindPopup(popupHtml(p));
 marker.bindTooltip(p.nome||"Punto",{
  permanent:true,
  direction:"right",
  offset:[10,0],
  className:"point-label"
 });
 marker.addTo(pointsLayer);
}
function accessColor(value){
 const v=String(value||"").trim().toLowerCase();
 if(v==="si"||v==="sì")return "#16a34a";
 if(v==="no")return "#dc2626";
 return "#374151";
}
function accessPopupHtml(p){
 const loc=esc(p.loc||"");
 const acc=esc(p.accessibile||p.Accessibile||p.accessibilita||p["Accessibilità"]||"Non valutato");
 return `<div class="popup-title">Punto ${esc(p.id)}</div>${loc?`<div class="popup-desc">${loc}</div>`:""}<div class="popup-meta">Accessibilità: ${acc}</div><div class="popup-meta">Lat: ${Number(p.y).toFixed(6)} | Lon: ${Number(p.x).toFixed(6)}</div>`;
}
function addAccessPoint(p){
 if(p.x===null||p.x===undefined||p.y===null||p.y===undefined)return;
 const acc=p.accessibile||p.Accessibile||p.accessibilita||p["Accessibilità"]||"Non valutato";
 const marker=L.circleMarker([Number(p.y),Number(p.x)],{
  radius:8,
  color:"#f97316",
  weight:2,
  fillColor:accessColor(acc),
  fillOpacity:.9
 });
 marker.bindPopup(accessPopupHtml(p));
 marker.bindTooltip(String(p.id||""),{
  permanent:true,
  direction:"right",
  offset:[10,0],
  className:"access-label"
 });
 marker.addTo(accessLayer);
}
async function loadAccessPoints(){
 accessLayer.clearLayers();
 const table=cfg.ACCESS_TABLE_NAME||"punti_sopralluogo";
 const {data,error}=await supabaseClient.from(table).select("*").order("id",{ascending:true});
 if(error){
  console.warn("Errore caricamento punti sopralluogo:",error);
  alert("Errore caricamento punti sopralluogo: "+error.message);
  return [];
 }
 const b=[];
 (data||[]).forEach(p=>{
  addAccessPoint(p);
  if(p.x!==null&&p.x!==undefined&&p.y!==null&&p.y!==undefined)b.push([Number(p.y),Number(p.x)]);
 });
 return b;
}
async function loadPoints(){
 pointsLayer.clearLayers();
 const {data,error}=await supabaseClient.from(cfg.TABLE_NAME).select("*").order("created_at",{ascending:false});
 if(error){
  alert("Errore caricamento punti: "+error.message);
  return;
 }
 const b=[];
 (data||[]).forEach(p=>{
  addPoint(p);
  if(p.lat!==null&&p.lon!==null)b.push([p.lat,p.lon]);
 });

 const accessBounds=await loadAccessPoints();
 const allBounds=b.concat(accessBounds||[]);
 if(allBounds.length)map.fitBounds(allBounds,{padding:[40,40],maxZoom:18});
}
loadPoints();
</script>
<script>if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"))}</script>
</body></html>
